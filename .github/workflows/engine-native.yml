name: Native engine

on:
  push:
    branches:
      - feature/modular-adaptive-engine
  pull_request:
    branches:
      - feature/modular-adaptive-engine
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    name: Linux C++20 engine
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S engine -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCAW_AUDIO=OFF -DCAW_TOOLS=ON
      - name: Build
        run: cmake --build build --parallel 2
      - name: Test
        run: ctest --test-dir build --output-on-failure
