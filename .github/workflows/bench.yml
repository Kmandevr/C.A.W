# Engine speed: builds Release caw_bench and runs its suite (caw_bench SECONDS 500) on Linux x64, Linux Arm64 and an Android arm64 binary on Arm64 hardware.
name: Bench
on:
  push:
    branches: [Main, speed-maths]  # TEMPORARY: speed phase 3 measurement; removed before merge
    paths:
      - "engine/**"
      - "!engine/compiler/**"
      - ".github/workflows/bench.yml"
  pull_request:
    paths:
      - "engine/**"
      - "!engine/compiler/**"
      - ".github/workflows/bench.yml"
  workflow_dispatch:
    inputs:
      seconds:
        description: Seconds of audio per scenario per run (the tail scenario always plays 30 s)
        default: "10"
      runs:
        description: Runs of the whole suite (the result is the median of their means and the largest worst case)
        default: "3"
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  SECONDS_PER: ${{ inputs.seconds || '10' }}
  RUNS: ${{ inputs.runs || '3' }}
  # The NDK the APK's engine is built with (Flutter's ndkVersion; app.yml caches the same one).
  NDK_VERSION: 28.2.13676358

jobs:
  linux:
    name: Bench (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: Linux x64, slug: linux-x64, os: ubuntu-24.04 }
          - { name: Linux arm64, slug: linux-arm64, os: ubuntu-24.04-arm }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - name: Build caw_bench (Release)
        run: |
          cmake -S engine -B build -DCMAKE_BUILD_TYPE=Release -DCAW_AUDIO=OFF
          cmake --build build --target caw_bench --parallel
      - name: Machine
        run: |
          uname -a
          lscpu | grep -E 'Model name|^CPU\(s\)|MHz' || true
          c++ --version | head -1
      - name: Run the suite
        run: |
          build/caw_bench "$SECONDS_PER" 500 --runs "$RUNS" --label "${{ matrix.name }}" \
            --json "bench-${{ matrix.slug }}.json" --md "bench-${{ matrix.slug }}.md"
          cat "bench-${{ matrix.slug }}.md" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        with:
          name: bench-${{ matrix.slug }}
          path: bench-${{ matrix.slug }}.*

  # Android: caw_bench cross-compiled with the APK's NDK for arm64-v8a as a static bionic executable (no
  # /system/bin/linker64 needed), then run on the ubuntu-24.04-arm runner: real Arm64 cores under a Linux kernel,
  # not an emulator (arm64 emulator images on x86 runners are translated and far too slow and noisy to time).
  android-build:
    name: Build (Android arm64)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Install the NDK
        run: |
          ndk="$ANDROID_HOME/ndk/$NDK_VERSION"
          if [ ! -d "$ndk" ]; then
            yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;$NDK_VERSION" > /dev/null
          fi
          grep Pkg.Revision "$ndk/source.properties"
          echo "NDK=$ndk" >> "$GITHUB_ENV"
      - name: Build caw_bench (Release, static)
        run: |
          cmake -S engine -B build-android -DCMAKE_BUILD_TYPE=Release -DCAW_AUDIO=OFF \
            -DCMAKE_TOOLCHAIN_FILE="$NDK/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a -DANDROID_PLATFORM=android-29 -DANDROID_STL=c++_static \
            -DCMAKE_EXE_LINKER_FLAGS=-static
          cmake --build build-android --target caw_bench --parallel
          file build-android/caw_bench
      - uses: actions/upload-artifact@v7
        with:
          name: caw-bench-android-arm64-binary
          path: build-android/caw_bench

  android-run:
    name: Bench (Android arm64 binary)
    needs: android-build
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: caw-bench-android-arm64-binary
      - name: Run the suite
        run: |
          chmod +x caw_bench
          file caw_bench || true
          lscpu | grep -E 'Model name|^CPU\(s\)' || true
          # bionic's temp directory default is Android's; point it at the runner's.
          TMPDIR="$RUNNER_TEMP" ./caw_bench "$SECONDS_PER" 500 --runs "$RUNS" --label "Android arm64 (bionic, on Linux arm64)" \
            --json bench-android-arm64.json --md bench-android-arm64.md
          cat bench-android-arm64.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        with:
          name: bench-android-arm64
          path: bench-android-arm64.*

  summary:
    name: Summary
    needs: [linux, android-run]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v7
        with:
          pattern: bench-*
          merge-multiple: true
      - name: One table for every target
        run: |
          python3 -I - <<'EOF' >> "$GITHUB_STEP_SUMMARY"
          import json, glob
          order = ["linux-x64", "linux-arm64", "android-arm64"]
          data = {}
          for f in glob.glob("bench-*.json"):
              with open(f) as h:
                  d = json.load(h)
              data[f[len("bench-"):-len(".json")]] = d
          targets = [t for t in order if t in data]
          if not targets:
              print("No bench results.")
              raise SystemExit
          first = data[targets[0]]
          print(f"## Engine bench: {first['frames']} frames at {first['rate']} Hz, budget {first['budget_us']:.0f} us\n")
          print("Mean / worst callback (us) and mean load (% of the budget); shared runners are noisy, so read worst cases as indicative.\n")
          print("| Scenario | " + " | ".join(f"{data[t]['label']}" for t in targets) + " |")
          print("|---|" + "---:|" * len(targets))
          ids = [s["id"] for s in first["scenarios"]]
          for sid in ids:
              cells = []
              name = sid
              for t in targets:
                  s = next((x for x in data[t]["scenarios"] if x["id"] == sid), None)
                  if s is None:
                      cells.append("-")
                      continue
                  name = s["name"]
                  cells.append(f"{s['mean_us']:.0f} / {s['worst_us']:.0f} ({s['mean_load_pct']:.1f}%)")
              print(f"| {name} | " + " | ".join(cells) + " |")
          EOF
