# Engine tests on every push and pull request: Linux x64 and Arm64, Windows, a sanitizer build and a ThreadSanitizer run of the mix pool. The same reference renders, within their tolerances, everywhere; on one thread and on the mix pool, the same bits.
name: Engine
on:
  # Main and pull requests; a branch's own pushes run only through its pull request, so nothing runs twice
  # (gpt/** branches get the Quick check until they open one).
  push:
    branches: [Main, speed-parallel]
    paths:
      - "engine/**"
      - "!engine/compiler/**"  # the compiler wrapper has its own workflow
      - "examples/**"          # examples are built in and checked by reference renders
      - ".github/workflows/engine.yml"
  pull_request:
    paths:
      - "engine/**"
      - "!engine/compiler/**"  # the compiler wrapper has its own workflow
      - "examples/**"          # examples are built in and checked by reference renders
      - ".github/workflows/engine.yml"
  workflow_dispatch:
permissions:
  contents: read

# Cancel obsolete runs for this workflow/PR when a newer commit arrives.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  test:
    name: Tests (${{ matrix.name }})
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include:
          - { name: Linux x64, os: ubuntu-24.04, flags: "" }
          - { name: Linux Arm64, os: ubuntu-24.04-arm, flags: "" }
          - { name: Windows x64, os: windows-2025, flags: "" }
          - { name: Linux sanitizers, os: ubuntu-24.04, flags: "-DCAW_SANITIZE=ON -DCMAKE_BUILD_TYPE=Debug" }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - name: Install ccache (Linux)
        if: runner.os == 'Linux'
        run: |
          if ! command -v ccache >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y ccache
          fi
          ccache --max-size=500M
      - name: Restore compiler cache (Linux)
        if: runner.os == 'Linux'
        uses: actions/cache@v4
        with:
          path: ~/.cache/ccache
          key: ccache-engine-${{ matrix.name }}-${{ hashFiles('engine/CMakeLists.txt', 'engine/src/**', 'engine/include/**', 'engine/platform/**') }}
          restore-keys: |
            ccache-engine-${{ matrix.name }}-
      - name: Configure (Linux)
        if: runner.os == 'Linux'
        run: cmake -S engine -B engine/build -DCMAKE_BUILD_TYPE=Release ${{ matrix.flags }} -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
      - name: Configure (Windows)
        if: runner.os == 'Windows'
        run: cmake -S engine -B engine/build -DCMAKE_BUILD_TYPE=Release ${{ matrix.flags }}
      - name: Build
        run: cmake --build engine/build --config Release --parallel
      - name: Test
        run: ctest --test-dir engine/build --build-config Release --output-on-failure --parallel 4

  # The mix pool (speed phase 5c) under ThreadSanitizer: its tests and a long stress run (random graphs with sends,
  # keys and buses, the project changed while it plays, injected worker delays), each against one thread's output.
  tsan:
    name: Tests (Linux ThreadSanitizer, mix pool)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Allow ThreadSanitizer's memory layout
        # [Assumption] TSAN maps its shadow memory at fixed addresses, and Clang 18's can stop with "unexpected memory
        # mapping" on a kernel with more mmap randomisation than it expects (32 bits); 28 bits keeps it clear.
        run: sudo sysctl vm.mmap_rnd_bits=28
      - name: Configure (Clang, CAW_TSAN)
        run: |
          clang++ --version | head -1
          cmake -S engine -B engine/build-tsan -DCMAKE_BUILD_TYPE=RelWithDebInfo -DCAW_TSAN=ON \
            -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++
      - name: Build
        run: cmake --build engine/build-tsan --target caw_tests --parallel -- -k  # every compile error at once
      - name: Mix pool tests and stress run
        env:
          CAW_POOL_STRESS_CHUNKS: "10000"
          TSAN_OPTIONS: "halt_on_error=1 second_deadlock_stack=1"
        run: |
          export CAW_TEST_COMPONENT_PATH="$PWD/engine/build-tsan/caw_test_component.so"
          engine/build-tsan/caw_tests mix_pool
