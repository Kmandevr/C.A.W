# Builds an independently authored component against the installed CAW SDK on each supported target, and as a CLAP plug-in.
name: C++ components
on:
  pull_request:
    paths:
      - "engine/CMakeLists.txt"
      - "engine/cmake/**"
      - "engine/include/caw/**"
      - "engine/include/caw_component.h"
      - "engine/plugin/**"
      - "examples/cpp/**"
      - "scripts/caw-component-build.js"
      - "scripts/caw-component-build.test.js"
      - ".github/workflows/cpp-components.yml"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  component:
    name: Component (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x64
            os: ubuntu-24.04
            android: false
          - name: Windows x64
            os: windows-2025
            android: false
          - name: Android ARM64
            os: ubuntu-24.04
            android: true
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Test structured build diagnostics
        run: node --test scripts/caw-component-build.test.js
      - name: Configure and install the SDK for the build host
        run: |
          cmake -S engine -B "$RUNNER_TEMP/caw-sdk-build" \
            -DCAW_AUDIO=OFF -DCAW_TOOLS=OFF -DCAW_INSTALL_SDK=ON \
            -DCMAKE_INSTALL_PREFIX="$RUNNER_TEMP/caw-sdk"
          cmake --install "$RUNNER_TEMP/caw-sdk-build" --config Release
      - name: Download Android NDK r30 (Google SDK licence accepted by owner)
        if: ${{ matrix.android }}
        run: |
          curl --fail --location --retry 3 \
            https://dl.google.com/android/repository/android-ndk-r30-linux.zip \
            --output "$RUNNER_TEMP/android-ndk.zip"
          echo "5107f898313790e449e87eee2183d9a20602dee9  $RUNNER_TEMP/android-ndk.zip" | sha1sum --check
          unzip -q "$RUNNER_TEMP/android-ndk.zip" -d "$RUNNER_TEMP"
          echo "ANDROID_NDK_HOME=$RUNNER_TEMP/android-ndk-r30" >> "$GITHUB_ENV"
      - name: Build component for desktop
        if: ${{ !matrix.android }}
        run: |
          node scripts/caw-component-build.js \
            --project examples/cpp/minimal --sdk "$RUNNER_TEMP/caw-sdk" \
            --build "$RUNNER_TEMP/caw-component-build" --config Release
      - name: Build component for Android ARM64
        if: matrix.android
        run: |
          node scripts/caw-component-build.js \
            --project examples/cpp/minimal --sdk "$RUNNER_TEMP/caw-sdk" \
            --build "$RUNNER_TEMP/caw-component-build" --config Release \
            --toolchain "$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake" \
            --android-abi arm64-v8a --android-platform android-24
      - name: Test component contract
        if: ${{ !matrix.android }}
        run: ctest --test-dir "$RUNNER_TEMP/caw-component-build" --build-config Release --output-on-failure
      - name: Build and test the example instrument for desktop
        if: ${{ !matrix.android }}
        run: |
          node scripts/caw-component-build.js \
            --project examples/cpp/poly-synth --sdk "$RUNNER_TEMP/caw-sdk" \
            --build "$RUNNER_TEMP/caw-instrument-build" --config Release
          ctest --test-dir "$RUNNER_TEMP/caw-instrument-build" --build-config Release --output-on-failure
      - name: Build and test the C++ starters for desktop
        if: ${{ !matrix.android }}
        run: |
          for starter in examples/cpp/starters/*/; do
            [ -f "$starter/caw-component.json" ] || continue  # tests/ holds the shared contract test
            name=$(basename "$starter")
            node scripts/caw-component-build.js \
              --project "$starter" --sdk "$RUNNER_TEMP/caw-sdk" \
              --build "$RUNNER_TEMP/caw-starter-$name" --config Release
            ctest --test-dir "$RUNNER_TEMP/caw-starter-$name" --build-config Release --output-on-failure
          done
      - name: Build the example instrument for Android ARM64
        if: matrix.android
        run: |
          node scripts/caw-component-build.js \
            --project examples/cpp/poly-synth --sdk "$RUNNER_TEMP/caw-sdk" \
            --build "$RUNNER_TEMP/caw-instrument-build" --config Release \
            --toolchain "$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake" \
            --android-abi arm64-v8a --android-platform android-24
      - name: Upload Android component artifact
        if: matrix.android
        uses: actions/upload-artifact@v7
        with:
          name: caw-minimal-component-android-arm64
          path: ${{ runner.temp }}/caw-component-build/artifacts/*
          if-no-files-found: error
          retention-days: 14
      - name: Upload desktop component artifact
        if: ${{ !matrix.android }}
        uses: actions/upload-artifact@v7
        with:
          name: caw-minimal-component-${{ matrix.name }}
          path: ${{ runner.temp }}/caw-component-build/artifacts/*
          if-no-files-found: error
          retention-days: 14

  # The plug-in builder: the example as a .clap for desktop hosts, and the CLAP test host on Linux.
  clap:
    name: CLAP plug-in (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x64
            os: ubuntu-24.04
            test: true
          - name: Windows x64
            os: windows-2025
            test: false
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - name: Install the SDK for the build host
        run: |
          cmake -S engine -B "$RUNNER_TEMP/caw-sdk-build" \
            -DCAW_AUDIO=OFF -DCAW_TOOLS=OFF -DCAW_INSTALL_SDK=ON \
            -DCMAKE_INSTALL_PREFIX="$RUNNER_TEMP/caw-sdk"
          cmake --install "$RUNNER_TEMP/caw-sdk-build" --config Release
      - name: Build the example as a CLAP plug-in (fetches the pinned CLAP headers)
        run: |
          cmake -S examples/cpp/minimal -B "$RUNNER_TEMP/caw-clap-build" -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="$RUNNER_TEMP/caw-sdk" -DCAW_BUILD_CLAP=ON
          cmake --build "$RUNNER_TEMP/caw-clap-build" --config Release --parallel
          find "$RUNNER_TEMP/caw-clap-build/artifacts" -name '*.clap' | grep -q .
      - name: Run the CLAP test host against the engine registry
        if: matrix.test
        run: |
          cmake -S engine -B "$RUNNER_TEMP/caw-clap-tests" -DCMAKE_BUILD_TYPE=Release -DCAW_AUDIO=OFF -DCAW_CLAP=ON
          cmake --build "$RUNNER_TEMP/caw-clap-tests" --target caw_clap_tests --parallel
          ctest --test-dir "$RUNNER_TEMP/caw-clap-tests" -R caw_clap_tests --output-on-failure
      - name: Upload the plug-in
        uses: actions/upload-artifact@v7
        with:
          name: caw-minimal-clap-${{ matrix.name }}
          path: ${{ runner.temp }}/caw-clap-build/artifacts/**/*.clap
          if-no-files-found: error
          retention-days: 14
