# Reusable: commits one file from a run's artifact to the agent-results branch, where chat agents read it.
name: Publish agent results
on:
  workflow_call:
    inputs:
      artifact:
        description: Artifact holding the file
        type: string
        required: true
      source:
        description: File name inside the artifact
        type: string
        required: true
      target:
        description: Path on the agent-results branch
        type: string
        required: true
permissions:
  contents: write
jobs:
  publish:
    name: Publish to agent-results
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: ${{ inputs.artifact }}
          path: payload
      - name: Commit to agent-results
        env:
          SOURCE: ${{ inputs.source }}
          TARGET: ${{ inputs.target }}
          REPO: ${{ github.repository }}
          TOKEN: ${{ github.token }}
        run: |
          # Only reports, the start file and a branch's screenshot folder may be written, whatever a caller passes.
          [[ "$TARGET" =~ ^(quick-check/[A-Za-z0-9._-]+\.md|START\.md|screens/[A-Za-z0-9._-]+)$ ]] || { echo "Refusing to publish to $TARGET"; exit 1; }
          [[ "$SOURCE" =~ ^(\.|[A-Za-z0-9._-]+)$ ]] || { echo "Refusing source $SOURCE"; exit 1; }
          src="$PWD/payload/$SOURCE"
          git init -q results && cd results
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # The token goes in a per-command header, not the remote URL, so it is never written to .git/config.
          auth="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$TOKEN" | base64 -w0)"
          echo "::add-mask::$(printf 'x-access-token:%s' "$TOKEN" | base64 -w0)"
          git remote add origin "https://github.com/${REPO}.git"
          for attempt in 1 2 3 4; do
            if git -c http.extraheader="$auth" fetch -q --depth 1 origin agent-results 2>/dev/null; then git checkout -q -B agent-results FETCH_HEAD
            else git checkout -q --orphan agent-results; git rm -rfq . 2>/dev/null || true; fi
            if [ -d "$src" ]; then rm -rf "$TARGET"; mkdir -p "$TARGET"; cp "$src"/*.png "$TARGET"/
            else mkdir -p "$(dirname "$TARGET")" && cp "$src" "$TARGET"; fi
            git add -A "$TARGET"
            # One line per branch report, so a new chat can find its branch and state without knowing the file name.
            if [[ "$TARGET" == quick-check/* ]]; then
              { echo "# Quick check index"; echo; echo "| Report | Status | Verdict | Commit | Time |"; echo "| --- | --- | --- | --- | --- |"
                for f in quick-check/*.md; do [ "$f" = quick-check/INDEX.md ] && continue
                  v() { sed -n "s/^- $1: *//p" "$f" | head -1 | tr -d '*\`' | cut -c1-40; }
                  echo "| [$(basename "$f" .md)]($(basename "$f")) | $(v Status) | $(v Verdict) | $(v Commit | cut -d" " -f1 | cut -c1-12) | $(v Finished)$(v Started) |"
                done; } > quick-check/INDEX.md
              git add quick-check/INDEX.md
            fi
            git diff --cached --quiet && { echo "$TARGET unchanged"; exit 0; }
            git commit -qm "Update $TARGET"
            git -c http.extraheader="$auth" push -q origin agent-results && { echo "Published $TARGET"; exit 0; }
            sleep $((attempt * 3))
          done
          echo "Could not publish $TARGET after 4 attempts." && exit 1
