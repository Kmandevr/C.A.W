# App checks: analysis and tests on every pull request; the Android APK and Windows app on Main or on demand;
# a GitHub Release (pre-release while in beta) from a version tag or from Run workflow with "release".
name: App
on:
  # Pull requests test the app (analysis, tests); Main also builds the installable APK and Windows app.
  # A branch's own pushes run nothing here, so a PR's commits aren't checked twice; "Run workflow" builds
  # everything on any branch (an APK to try before merging).
  push:
    branches: [Main]
    # A version tag (v0.9.0-beta.2) builds both installables and publishes them as a GitHub Release.
    # GitHub does not apply the path filter below to tag pushes.
    tags: ["v*"]
    paths:
      - "app/**"
      # The engine code the app embeds (not its tests, benchmarks, CLI or the compiler wrapper).
      - "engine/CMakeLists.txt"
      - "engine/cmake/**"
      - "engine/include/**"
      - "engine/src/**"
      - "engine/platform/**"
      - "engine/lib/**"
      - "engine/third_party/**"
      - "examples/**"
      - ".github/workflows/app.yml"
      - "engine/compiler/**"  # the APK carries the compiler
  pull_request:
    paths:
      - "app/**"
      # The engine code the app embeds (not its tests, benchmarks, CLI or the compiler wrapper).
      - "engine/CMakeLists.txt"
      - "engine/cmake/**"
      - "engine/include/**"
      - "engine/src/**"
      - "engine/platform/**"
      - "engine/lib/**"
      - "engine/third_party/**"
      - "examples/**"
      - ".github/workflows/app.yml"
  workflow_dispatch:
    inputs:
      installables:
        description: Also build the Android APK and the Windows app (off for a quick test-only run)
        type: boolean
        default: true
      release:
        description: Publish the installables as a GitHub Release tagged v<version from app/pubspec.yaml> (pre-release while in beta)
        type: boolean
        default: false
  # The APK carries the on-device compiler, whose LLVM build the Compiler workflow caches on Main. When that
  # workflow finishes there, the APK is built again so Main's APK always has the compiler (only the APK runs).
  workflow_run:
    workflows: [Compiler]
    types: [completed]
    branches: [Main]
permissions:
  contents: read

concurrency:
  # By trigger too: the APK run after the Compiler workflow never cancels Main's own checks.
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
env:
  FLUTTER_VERSION: 3.47.7
  FLUTTER_SHA_LINUX: af7455f540df951184c7953fbe3cf884766e7541dacf8571f9f582db03dd6230
  FLUTTER_SHA_WINDOWS: c2c875da25a1a1448d18ee4e8f398b2f6fce888b4775d8f9130538e16d826cb4

jobs:
  analyze:
    name: Dart analysis
    if: github.event_name != 'workflow_run'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Restore Flutter SDK
        id: flutter-cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/flutter
          key: flutter-linux-${{ env.FLUTTER_VERSION }}-${{ env.FLUTTER_SHA_LINUX }}
      - name: Install Flutter
        if: steps.flutter-cache.outputs.cache-hit != 'true'
        run: |
          curl -sSfL -o flutter.tar.xz "https://storage.googleapis.com/flutter_infra_release/releases/stable/linux/flutter_linux_${FLUTTER_VERSION}-stable.tar.xz"
          echo "${FLUTTER_SHA_LINUX}  flutter.tar.xz" | sha256sum -c -
          tar xf flutter.tar.xz -C "$RUNNER_TEMP" && rm flutter.tar.xz
      - name: Add Flutter to PATH
        run: echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
      - name: Restore Dart packages
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: pub-linux-${{ hashFiles('app/pubspec.lock') }}
          restore-keys: pub-linux-
      - name: Analyze
        working-directory: app
        run: |
          flutter --disable-analytics
          flutter pub get
          flutter analyze

  tests:
    name: Dart tests
    if: github.event_name != 'workflow_run'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Restore Flutter SDK
        id: flutter-cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/flutter
          key: flutter-linux-${{ env.FLUTTER_VERSION }}-${{ env.FLUTTER_SHA_LINUX }}
      - name: Install Flutter
        if: steps.flutter-cache.outputs.cache-hit != 'true'
        run: |
          curl -sSfL -o flutter.tar.xz "https://storage.googleapis.com/flutter_infra_release/releases/stable/linux/flutter_linux_${FLUTTER_VERSION}-stable.tar.xz"
          echo "${FLUTTER_SHA_LINUX}  flutter.tar.xz" | sha256sum -c -
          tar xf flutter.tar.xz -C "$RUNNER_TEMP" && rm flutter.tar.xz
      - name: Add Flutter to PATH
        run: echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
      - name: Restore Dart packages
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: pub-linux-${{ hashFiles('app/pubspec.lock') }}
          restore-keys: pub-linux-
      - name: Install ccache
        run: |
          if ! command -v ccache >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y ccache
          fi
          ccache --max-size=500M
      - name: Restore native compiler cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ccache
          key: ccache-linux-app-${{ hashFiles('engine/CMakeLists.txt', 'engine/src/**', 'engine/include/**', 'engine/platform/**') }}
          restore-keys: ccache-linux-app-
      - name: Build engine library for native-backed app tests
        run: |
          cmake -S engine -B engine/build -DCMAKE_BUILD_TYPE=Release -DCAW_TOOLS=OFF -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
          cmake --build engine/build --parallel
          ccache --show-stats
      - name: Test
        working-directory: app
        env:
          CAW_LIB: ${{ github.workspace }}/engine/build/libcaw.so
        run: |
          flutter pub get
          flutter test --concurrency=4

  android:
    name: Android APK
    # Installables come from Main, from Run workflow (unless switched off) and after the Compiler workflow
    # succeeds on Main; never from a pull request.
    if: >-
      github.event_name == 'push' ||
      (github.event_name == 'workflow_dispatch' && inputs.installables) ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
          cache: gradle  # Gradle's dependencies and wrapper, so a build doesn't fetch them again
      - name: Restore Flutter SDK
        id: flutter-cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/flutter
          key: flutter-linux-${{ env.FLUTTER_VERSION }}-${{ env.FLUTTER_SHA_LINUX }}
      - name: Install Flutter
        if: steps.flutter-cache.outputs.cache-hit != 'true'
        run: |
          curl -sSfL -o flutter.tar.xz "https://storage.googleapis.com/flutter_infra_release/releases/stable/linux/flutter_linux_${FLUTTER_VERSION}-stable.tar.xz"
          echo "${FLUTTER_SHA_LINUX}  flutter.tar.xz" | sha256sum -c -
          tar xf flutter.tar.xz -C "$RUNNER_TEMP" && rm flutter.tar.xz
      - name: Add Flutter to PATH
        run: echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
      - name: Restore Dart packages
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: pub-linux-${{ hashFiles('app/pubspec.lock') }}
          restore-keys: pub-linux-
      # The Android SDK packages Gradle installs for the engine build (the pinned CMake and NDK), so they
      # aren't installed again every time.
      - name: Restore Android SDK packages
        uses: actions/cache@v4
        with:
          path: |
            /usr/local/lib/android/sdk/cmake/3.22.1
            /usr/local/lib/android/sdk/ndk/28.2.13676358
          key: android-sdk-cmake-3.22.1-ndk-28.2.13676358
      # The engine's native build (libcaw.so) reuses compiled files: only changed sources recompile.
      - name: Install ccache
        run: |
          if ! command -v ccache >/dev/null 2>&1; then sudo apt-get update -q && sudo apt-get install -y -q ccache; fi
          ccache --max-size=500M
          echo "CAW_CCACHE=1" >> "$GITHUB_ENV"
      - name: Restore the native compiler cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ccache
          key: ccache-android-${{ hashFiles('engine/CMakeLists.txt', 'engine/src/**', 'engine/include/**', 'engine/platform/**') }}
          restore-keys: ccache-android-
      - name: Signing key (when the repository has one)
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/caw.jks"
            echo "CAW_KEYSTORE_PATH=$RUNNER_TEMP/caw.jks" >> "$GITHUB_ENV"
            echo "Signing with the repository key."
          else
            echo "No ANDROID_KEYSTORE_BASE64 secret: signing with a throwaway debug key (uninstall before installing the next build)."
          fi
      # The on-device C++ compiler goes in the APK. The finished package is cached and rebuilt only when the
      # compiler or the SDK changes; building it needs the Compiler workflow's cached LLVM build. Until that
      # exists the APK is built without the compiler, and says so.
      - name: Restore the packaged compiler
        id: package-cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/compiler-package
          key: caw-compiler-package-llvm-23.1.5-${{ hashFiles('engine/compiler/**', 'engine/include/**', 'engine/CMakeLists.txt', 'engine/cmake/**') }}
      - name: Restore the compiler's LLVM build
        id: llvm-cache
        if: steps.package-cache.outputs.cache-hit != 'true'
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/llvm-install
          key: llvm-23.1.5-android-arm64-${{ hashFiles('engine/compiler/build-llvm.sh') }}
      - name: Package the on-device compiler
        if: steps.package-cache.outputs.cache-hit != 'true' && steps.llvm-cache.outputs.cache-hit == 'true'
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q ninja-build zip
          curl --fail --location --retry 3 https://dl.google.com/android/repository/android-ndk-r30-linux.zip \
            --output "$RUNNER_TEMP/android-ndk.zip"
          echo "5107f898313790e449e87eee2183d9a20602dee9  $RUNNER_TEMP/android-ndk.zip" | sha1sum --check
          unzip -q "$RUNNER_TEMP/android-ndk.zip" -d "$RUNNER_TEMP" && rm "$RUNNER_TEMP/android-ndk.zip"
          engine/compiler/package-android.sh "$RUNNER_TEMP/llvm-install" "$RUNNER_TEMP/android-ndk-r30" \
            "$GITHUB_WORKSPACE" "$RUNNER_TEMP/compiler-package"
      - name: Save the packaged compiler
        if: steps.package-cache.outputs.cache-hit != 'true' && steps.llvm-cache.outputs.cache-hit == 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/compiler-package
          key: ${{ steps.package-cache.outputs.cache-primary-key }}
      - name: Use the packaged compiler
        if: steps.package-cache.outputs.cache-hit == 'true' || steps.llvm-cache.outputs.cache-hit == 'true'
        run: echo "CAW_COMPILER_PACKAGE=$RUNNER_TEMP/compiler-package" >> "$GITHUB_ENV"
      - name: Note a build without the compiler
        if: steps.package-cache.outputs.cache-hit != 'true' && steps.llvm-cache.outputs.cache-hit != 'true'
        run: |
          echo "::warning::This APK has no C++ compiler yet: the Compiler workflow has not cached its LLVM build. Re-run this job when it has."
      - name: Build
        working-directory: app
        env:
          CAW_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          CAW_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          CAW_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          flutter --disable-analytics
          # arm64 only: the phones C.A.W targets (the owner's Galaxy S22+). Each extra ABI builds the engine and
          # the Dart code again.
          # --split-debug-info keeps the Dart stack-trace tables out of the APK (libapp.so 10.2 -> 8.8 MB, docs/
          # performance.md); a reported trace is decoded with `flutter symbolize -d app.android-arm64.symbols`.
          # No --obfuscate: it saves only 0.13 MB more and would garble type names in the app's own error texts.
          flutter build apk --release --target-platform android-arm64 --split-debug-info=build/symbols
          ccache --show-stats || true
          mv build/app/outputs/flutter-apk/app-release.apk "$GITHUB_WORKSPACE/caw-android.apk"
          (cd build/symbols && zip -q "$GITHUB_WORKSPACE/caw-android-symbols.zip" ./*.symbols)
      - uses: actions/upload-artifact@v7
        with:
          name: caw-android-apk
          path: caw-android.apk
          retention-days: 30
      - uses: actions/upload-artifact@v7
        with:
          name: caw-android-symbols
          path: caw-android-symbols.zip
          retention-days: 90

  windows:
    name: Windows app
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.installables)
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v7
      - name: Restore Flutter SDK
        id: flutter-cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/flutter
          key: flutter-windows-${{ env.FLUTTER_VERSION }}-${{ env.FLUTTER_SHA_WINDOWS }}
      - name: Install Flutter
        if: steps.flutter-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $zip = "$env:RUNNER_TEMP\flutter.zip"
          Invoke-WebRequest "https://storage.googleapis.com/flutter_infra_release/releases/stable/windows/flutter_windows_$env:FLUTTER_VERSION-stable.zip" -OutFile $zip
          if ((Get-FileHash $zip -Algorithm SHA256).Hash.ToLower() -ne $env:FLUTTER_SHA_WINDOWS) { throw "Flutter download checksum mismatch" }
          Expand-Archive $zip -DestinationPath $env:RUNNER_TEMP
      - name: Add Flutter to PATH
        shell: pwsh
        run: '"$env:RUNNER_TEMP\flutter\bin" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8'
      - name: Restore Dart packages
        uses: actions/cache@v4
        with:
          path: ~\AppData\Local\Pub\Cache
          key: pub-windows-${{ hashFiles('app/pubspec.lock') }}
          restore-keys: pub-windows-
      - name: Build
        working-directory: app
        run: |
          flutter --disable-analytics
          flutter build windows --release
      - uses: actions/upload-artifact@v7
        with:
          name: caw-windows
          path: app/build/windows/x64/runner/Release/
          retention-days: 30
      - name: Zip the Windows app
        shell: pwsh
        run: Compress-Archive -Path app/build/windows/x64/runner/Release/* -DestinationPath caw-windows.zip
      - uses: actions/upload-artifact@v7
        with:
          name: caw-windows-zip
          path: caw-windows.zip
          retention-days: 30

  release:
    name: GitHub Release
    needs: [android, windows]
    if: >-
      startsWith(github.ref, 'refs/tags/v') ||
      (github.event_name == 'workflow_dispatch' && inputs.installables && inputs.release)
    runs-on: ubuntu-24.04
    # Only this job may write: it creates the tag (when Run workflow made the release) and the release.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v7
        with:
          name: caw-android-apk
      - uses: actions/download-artifact@v7
        with:
          name: caw-android-symbols
      - uses: actions/download-artifact@v7
        with:
          name: caw-windows-zip
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          SIGNED: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
        run: |
          version=$(sed -n 's/^version: *\([^+]*\).*/\1/p' app/pubspec.yaml)
          tag="v$version"
          if [[ "$GITHUB_REF" == refs/tags/* && "$GITHUB_REF_NAME" != "$tag" ]]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match app/pubspec.yaml's version ($tag)."; exit 1
          fi
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "::error::Release $tag already exists: raise the version in app/pubspec.yaml and app/lib/version.dart first."; exit 1
          fi
          mv caw-android.apk "caw-$version-android.apk"
          mv caw-windows.zip "caw-$version-windows.zip"
          mv caw-android-symbols.zip "caw-$version-android-symbols.zip"
          {
            echo "C.A.W. $version"
            echo
            echo "- Android (arm64): caw-$version-android.apk"
            echo "- Windows (x64): caw-$version-windows.zip, unzip and run caw.exe"
            echo "- Android debug symbols (for decoding a reported stack trace): caw-$version-android-symbols.zip"
            if [ "$SIGNED" != "true" ]; then
              echo
              echo "This APK is signed with a throwaway key: uninstall the previous C.A.W. before installing it."
            fi
          } > notes.md
          prerelease=""
          [[ "$version" == *-* ]] && prerelease="--prerelease"
          gh release create "$tag" --target "$GITHUB_SHA" --title "C.A.W. $version" $prerelease \
            --notes-file notes.md --generate-notes \
            "caw-$version-android.apk" "caw-$version-windows.zip" "caw-$version-android-symbols.zip"
