# App checks: analysis and tests on every pull request; the Android APK and Windows app on Main or on demand;
# a GitHub Release (pre-release while in beta) from a version tag or from Run workflow with "release"; and each
# push to Main that builds replaces the rolling "Every change" pre-release (tag latest-main). Both publish the
# small-update manifest and patches (scripts/update-delta.js).
name: App
on:
  # Pull requests test the app (analysis, tests); Main also builds the installable APK and Windows app.
  # A branch's own pushes run nothing here, so a PR's commits aren't checked twice; "Run workflow" builds
  # everything on any branch (an APK to try before merging).
  push:
    branches: [Main]
    # A version tag (v1.0.0-alpha.1) builds both installables and publishes them as a GitHub Release.
    # GitHub does not apply the path filter below to tag pushes.
    tags: ["v*"]
    paths:
      - "app/**"
      # The engine code the app embeds (not its tests, benchmarks, CLI or the compiler wrapper).
      - "engine/CMakeLists.txt"
      - "engine/cmake/**"
      - "engine/include/**"
      - "engine/src/**"
      - "engine/platform/**"
      - "engine/lib/**"
      - "engine/third_party/**"
      - "examples/**"
      - ".github/workflows/app.yml"
      - "scripts/update-delta*.js"  # the small-update assets the release jobs publish
      - "CHANGELOG.md"  # bundled in the app (What's new) and the top of each release's notes
      - "scripts/changelog-notes*.js"
      - "engine/compiler/**"  # the APK carries the compiler
  pull_request:
    paths:
      - "app/**"
      # The engine code the app embeds (not its tests, benchmarks, CLI or the compiler wrapper).
      - "engine/CMakeLists.txt"
      - "engine/cmake/**"
      - "engine/include/**"
      - "engine/src/**"
      - "engine/platform/**"
      - "engine/lib/**"
      - "engine/third_party/**"
      - "examples/**"
      - ".github/workflows/app.yml"
      - "scripts/update-delta*.js"
      - "CHANGELOG.md"
      - "scripts/changelog-notes*.js"
  workflow_dispatch:
    inputs:
      installables:
        description: Also build the Android APK and the Windows app (off for a quick test-only run)
        type: boolean
        default: true
      release:
        description: Publish the installables as a GitHub Release tagged v<version from app/pubspec.yaml> (pre-release while in beta)
        type: boolean
        default: false
  # The APK carries the on-device compiler, whose LLVM build the Compiler workflow caches on Main. When that
  # workflow finishes there, the APK is built again so Main's APK always has the compiler (only the APK runs).
  workflow_run:
    workflows: [Compiler]
    types: [completed]
    branches: [Main]
permissions:
  contents: read

concurrency:
  # By trigger too: the APK run after the Compiler workflow never cancels Main's own checks.
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
env:
  # Telemetry (docs/app.md "Privacy, telemetry and feedback"; beta readiness plan E1, G1): the build channel (beta: on
  # by default; release: off until the user turns it on) and the relay. None of these is a secret: the URL and the
  # app key ship in the app. Repository variables of the same names override them. Each build also gets CAW_BUILD,
  # the first 12 characters of the commit it was built from (reports' app.build).
  # The channel is beta here; the "Telemetry channel" step switches a published final release to release.
  CAW_CHANNEL: ${{ vars.CAW_CHANNEL || 'beta' }}
  CAW_RELAY_URL: ${{ vars.CAW_RELAY_URL || 'https://caw-telemetry.kmandevr.workers.dev' }}
  CAW_APP_KEY: ${{ vars.CAW_APP_KEY || 'caw-beta-1' }}
  FLUTTER_VERSION: 3.47.7
  FLUTTER_SHA_LINUX: af7455f540df951184c7953fbe3cf884766e7541dacf8571f9f582db03dd6230
  FLUTTER_SHA_WINDOWS: c2c875da25a1a1448d18ee4e8f398b2f6fce888b4775d8f9130538e16d826cb4

jobs:
  analyze:
    name: Dart analysis
    if: github.event_name != 'workflow_run'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Restore Flutter SDK
        id: flutter-cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/flutter
          key: flutter-linux-${{ env.FLUTTER_VERSION }}-${{ env.FLUTTER_SHA_LINUX }}
      - name: Install Flutter
        if: steps.flutter-cache.outputs.cache-hit != 'true'
        run: |
          curl -sSfL -o flutter.tar.xz "https://storage.googleapis.com/flutter_infra_release/releases/stable/linux/flutter_linux_${FLUTTER_VERSION}-stable.tar.xz"
          echo "${FLUTTER_SHA_LINUX}  flutter.tar.xz" | sha256sum -c -
          tar xf flutter.tar.xz -C "$RUNNER_TEMP" && rm flutter.tar.xz
      - name: Add Flutter to PATH
        run: echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
      - name: Restore Dart packages
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: pub-linux-${{ hashFiles('app/pubspec.lock') }}
          restore-keys: pub-linux-
      - name: Analyze
        working-directory: app
        run: |
          flutter --disable-analytics
          flutter pub get
          flutter analyze

  tests:
    name: Dart tests
    if: github.event_name != 'workflow_run'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Restore Flutter SDK
        id: flutter-cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/flutter
          key: flutter-linux-${{ env.FLUTTER_VERSION }}-${{ env.FLUTTER_SHA_LINUX }}
      - name: Install Flutter
        if: steps.flutter-cache.outputs.cache-hit != 'true'
        run: |
          curl -sSfL -o flutter.tar.xz "https://storage.googleapis.com/flutter_infra_release/releases/stable/linux/flutter_linux_${FLUTTER_VERSION}-stable.tar.xz"
          echo "${FLUTTER_SHA_LINUX}  flutter.tar.xz" | sha256sum -c -
          tar xf flutter.tar.xz -C "$RUNNER_TEMP" && rm flutter.tar.xz
      - name: Add Flutter to PATH
        run: echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
      - name: Restore Dart packages
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: pub-linux-${{ hashFiles('app/pubspec.lock') }}
          restore-keys: pub-linux-
      - name: Install ccache
        run: |
          if ! command -v ccache >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y ccache
          fi
          ccache --max-size=500M
      - name: Restore native compiler cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ccache
          key: ccache-linux-app-${{ hashFiles('engine/CMakeLists.txt', 'engine/src/**', 'engine/include/**', 'engine/platform/**') }}
          restore-keys: ccache-linux-app-
      - name: Build engine library for native-backed app tests
        run: |
          cmake -S engine -B engine/build -DCMAKE_BUILD_TYPE=Release -DCAW_TOOLS=OFF -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
          cmake --build engine/build --parallel
          ccache --show-stats
      - name: Test
        working-directory: app
        env:
          CAW_LIB: ${{ github.workspace }}/engine/build/libcaw.so
        run: |
          flutter pub get
          flutter test --concurrency=4
      - name: Test the small-update builder and the release-notes extraction
        run: node --test scripts/update-delta.test.js scripts/changelog-notes.test.js

  android:
    name: Android APK
    # Installables come from Main, from Run workflow (unless switched off) and after the Compiler workflow
    # succeeds on Main; never from a pull request.
    if: >-
      github.event_name == 'push' ||
      (github.event_name == 'workflow_dispatch' && inputs.installables) ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
          cache: gradle  # Gradle's dependencies and wrapper, so a build doesn't fetch them again
      - name: Restore Flutter SDK
        id: flutter-cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/flutter
          key: flutter-linux-${{ env.FLUTTER_VERSION }}-${{ env.FLUTTER_SHA_LINUX }}
      - name: Install Flutter
        if: steps.flutter-cache.outputs.cache-hit != 'true'
        run: |
          curl -sSfL -o flutter.tar.xz "https://storage.googleapis.com/flutter_infra_release/releases/stable/linux/flutter_linux_${FLUTTER_VERSION}-stable.tar.xz"
          echo "${FLUTTER_SHA_LINUX}  flutter.tar.xz" | sha256sum -c -
          tar xf flutter.tar.xz -C "$RUNNER_TEMP" && rm flutter.tar.xz
      - name: Add Flutter to PATH
        run: echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
      - name: Restore Dart packages
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: pub-linux-${{ hashFiles('app/pubspec.lock') }}
          restore-keys: pub-linux-
      # The Android SDK packages Gradle installs for the engine build (the pinned CMake and NDK), so they
      # aren't installed again every time.
      - name: Restore Android SDK packages
        uses: actions/cache@v4
        with:
          path: |
            /usr/local/lib/android/sdk/cmake/3.22.1
            /usr/local/lib/android/sdk/ndk/28.2.13676358
          key: android-sdk-cmake-3.22.1-ndk-28.2.13676358
      # The engine's native build (libcaw.so) reuses compiled files: only changed sources recompile.
      - name: Install ccache
        run: |
          if ! command -v ccache >/dev/null 2>&1; then sudo apt-get update -q && sudo apt-get install -y -q ccache; fi
          ccache --max-size=500M
          echo "CAW_CCACHE=1" >> "$GITHUB_ENV"
      - name: Restore the native compiler cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ccache
          key: ccache-android-${{ hashFiles('engine/CMakeLists.txt', 'engine/src/**', 'engine/include/**', 'engine/platform/**') }}
          restore-keys: ccache-android-
      - name: Signing key (when the repository has one)
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/caw.jks"
            echo "CAW_KEYSTORE_PATH=$RUNNER_TEMP/caw.jks" >> "$GITHUB_ENV"
            echo "Signing with the repository key."
          else
            echo "No ANDROID_KEYSTORE_BASE64 secret: signing with a throwaway debug key (uninstall before installing the next build)."
          fi
      # The on-device C++ compiler goes in the APK. The finished package is cached and rebuilt only when the
      # compiler or the SDK changes; building it needs the Compiler workflow's cached LLVM build. Until that
      # exists the APK is built without the compiler, and says so.
      - name: Restore the packaged compiler
        id: package-cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/compiler-package
          key: caw-compiler-package-llvm-23.1.5-${{ hashFiles('engine/compiler/**', 'engine/include/**', 'engine/CMakeLists.txt', 'engine/cmake/**') }}
      - name: Restore the compiler's LLVM build
        id: llvm-cache
        if: steps.package-cache.outputs.cache-hit != 'true'
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/llvm-install
          key: llvm-23.1.5-android-arm64-${{ hashFiles('engine/compiler/build-llvm.sh') }}
      - name: Package the on-device compiler
        if: steps.package-cache.outputs.cache-hit != 'true' && steps.llvm-cache.outputs.cache-hit == 'true'
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q ninja-build zip
          curl --fail --location --retry 3 https://dl.google.com/android/repository/android-ndk-r30-linux.zip \
            --output "$RUNNER_TEMP/android-ndk.zip"
          echo "5107f898313790e449e87eee2183d9a20602dee9  $RUNNER_TEMP/android-ndk.zip" | sha1sum --check
          unzip -q "$RUNNER_TEMP/android-ndk.zip" -d "$RUNNER_TEMP" && rm "$RUNNER_TEMP/android-ndk.zip"
          engine/compiler/package-android.sh "$RUNNER_TEMP/llvm-install" "$RUNNER_TEMP/android-ndk-r30" \
            "$GITHUB_WORKSPACE" "$RUNNER_TEMP/compiler-package"
      - name: Save the packaged compiler
        if: steps.package-cache.outputs.cache-hit != 'true' && steps.llvm-cache.outputs.cache-hit == 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/compiler-package
          key: ${{ steps.package-cache.outputs.cache-primary-key }}
      - name: Use the packaged compiler
        if: steps.package-cache.outputs.cache-hit == 'true' || steps.llvm-cache.outputs.cache-hit == 'true'
        run: echo "CAW_COMPILER_PACKAGE=$RUNNER_TEMP/compiler-package" >> "$GITHUB_ENV"
      - name: Note a build without the compiler
        if: steps.package-cache.outputs.cache-hit != 'true' && steps.llvm-cache.outputs.cache-hit != 'true'
        run: |
          echo "::warning::This APK has no C++ compiler yet: the Compiler workflow has not cached its LLVM build. Re-run this job when it has."
      - name: Telemetry channel
        # Release channel only for a final version published as a GitHub Release (a tag push, or Run workflow with
        # "release"); a pre-release version such as 1.0.0-beta.1 is a beta build, as are plain Main and dispatch builds.
        shell: bash
        env:
          PUBLISHING: ${{ startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.release) }}
          KEY_VAR: ${{ vars.CAW_APP_KEY }}
        run: |
          version=$(sed -n 's/^version: *\([^+]*\).*/\1/p' app/pubspec.yaml)
          channel=$CAW_CHANNEL
          [[ "$PUBLISHING" == true && "$version" != *-* ]] && channel=release
          echo "CAW_CHANNEL=$channel" >> "$GITHUB_ENV"
          # Each channel's app key (owner, 2026-11-12), unless a repository variable names one.
          if [[ "$channel" == release && -z "$KEY_VAR" ]]; then echo "CAW_APP_KEY=caw-release-1" >> "$GITHUB_ENV"; fi
          echo "Telemetry channel for $version: $channel"
      - name: Build
        working-directory: app
        env:
          CAW_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          CAW_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          CAW_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          flutter --disable-analytics
          # arm64 only: the phones C.A.W targets (the owner's Galaxy S22+). Each extra ABI builds the engine and
          # the Dart code again.
          # --split-debug-info keeps the Dart stack-trace tables out of the APK (libapp.so 10.2 -> 8.8 MB, docs/
          # performance.md); a reported trace is decoded with `flutter symbolize -d app.android-arm64.symbols`.
          # No --obfuscate: it saves only 0.13 MB more and would garble type names in the app's own error texts.
          # CAW_BUILD: the first 12 characters of the commit, for the update check (the "Every change" notes' Build:
          # line) and telemetry's app.build.
          flutter build apk --release --target-platform android-arm64 --split-debug-info=build/symbols \
            --dart-define=CAW_CHANNEL="$CAW_CHANNEL" --dart-define=CAW_RELAY_URL="$CAW_RELAY_URL" \
            --dart-define=CAW_APP_KEY="$CAW_APP_KEY" --dart-define=CAW_BUILD="${GITHUB_SHA::12}"
          ccache --show-stats || true
          mv build/app/outputs/flutter-apk/app-release.apk "$GITHUB_WORKSPACE/caw-android.apk"
          (cd build/symbols && zip -q "$GITHUB_WORKSPACE/caw-android-symbols.zip" ./*.symbols)
      - uses: actions/upload-artifact@v7
        with:
          name: caw-android-apk
          path: caw-android.apk
          retention-days: 30
      - uses: actions/upload-artifact@v7
        with:
          name: caw-android-symbols
          path: caw-android-symbols.zip
          retention-days: 90

  windows:
    name: Windows app
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.installables)
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v7
      - name: Restore Flutter SDK
        id: flutter-cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/flutter
          key: flutter-windows-${{ env.FLUTTER_VERSION }}-${{ env.FLUTTER_SHA_WINDOWS }}
      - name: Install Flutter
        if: steps.flutter-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $zip = "$env:RUNNER_TEMP\flutter.zip"
          Invoke-WebRequest "https://storage.googleapis.com/flutter_infra_release/releases/stable/windows/flutter_windows_$env:FLUTTER_VERSION-stable.zip" -OutFile $zip
          if ((Get-FileHash $zip -Algorithm SHA256).Hash.ToLower() -ne $env:FLUTTER_SHA_WINDOWS) { throw "Flutter download checksum mismatch" }
          Expand-Archive $zip -DestinationPath $env:RUNNER_TEMP
      - name: Add Flutter to PATH
        shell: pwsh
        run: '"$env:RUNNER_TEMP\flutter\bin" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8'
      - name: Restore Dart packages
        uses: actions/cache@v4
        with:
          path: ~\AppData\Local\Pub\Cache
          key: pub-windows-${{ hashFiles('app/pubspec.lock') }}
          restore-keys: pub-windows-
      - name: Telemetry channel
        # Release channel only for a final version published as a GitHub Release (a tag push, or Run workflow with
        # "release"); a pre-release version such as 1.0.0-beta.1 is a beta build, as are plain Main and dispatch builds.
        shell: bash
        env:
          PUBLISHING: ${{ startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.release) }}
          KEY_VAR: ${{ vars.CAW_APP_KEY }}
        run: |
          version=$(sed -n 's/^version: *\([^+]*\).*/\1/p' app/pubspec.yaml)
          channel=$CAW_CHANNEL
          [[ "$PUBLISHING" == true && "$version" != *-* ]] && channel=release
          echo "CAW_CHANNEL=$channel" >> "$GITHUB_ENV"
          # Each channel's app key (owner, 2026-11-12), unless a repository variable names one.
          if [[ "$channel" == release && -z "$KEY_VAR" ]]; then echo "CAW_APP_KEY=caw-release-1" >> "$GITHUB_ENV"; fi
          echo "Telemetry channel for $version: $channel"
      - name: Build
        working-directory: app
        run: |
          flutter --disable-analytics
          flutter build windows --release --dart-define=CAW_CHANNEL="$env:CAW_CHANNEL" `
            --dart-define=CAW_RELAY_URL="$env:CAW_RELAY_URL" --dart-define=CAW_APP_KEY="$env:CAW_APP_KEY" `
            --dart-define=CAW_BUILD="$($env:GITHUB_SHA.Substring(0, 12))"
      - uses: actions/upload-artifact@v7
        with:
          name: caw-windows
          path: app/build/windows/x64/runner/Release/
          retention-days: 30
      - name: Zip the Windows app
        shell: pwsh
        run: Compress-Archive -Path app/build/windows/x64/runner/Release/* -DestinationPath caw-windows.zip
      - uses: actions/upload-artifact@v7
        with:
          name: caw-windows-zip
          path: caw-windows.zip
          retention-days: 30

  release:
    name: GitHub Release
    needs: [android, windows]
    if: >-
      startsWith(github.ref, 'refs/tags/v') ||
      (github.event_name == 'workflow_dispatch' && inputs.installables && inputs.release)
    runs-on: ubuntu-24.04
    # Only this job may write: it creates the tag (when Run workflow made the release) and the release.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v7
        with:
          name: caw-android-apk
      - uses: actions/download-artifact@v7
        with:
          name: caw-android-symbols
      - uses: actions/download-artifact@v7
        with:
          name: caw-windows-zip
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          SIGNED: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
        run: |
          version=$(sed -n 's/^version: *\([^+]*\).*/\1/p' app/pubspec.yaml)
          tag="v$version"
          if [[ "$GITHUB_REF" == refs/tags/* && "$GITHUB_REF_NAME" != "$tag" ]]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match app/pubspec.yaml's version ($tag)."; exit 1
          fi
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "::error::Release $tag already exists: raise the version in app/pubspec.yaml and app/lib/version.dart first."; exit 1
          fi
          # The notes start with this version's CHANGELOG.md entry ("## <version>", its "(…)" suffix ignored); a
          # release without one fails here (scripts/changelog-notes.js).
          if ! node scripts/changelog-notes.js --version "$version" > changes.md; then
            echo "::error::CHANGELOG.md has no entry for $version: add a \"## $version\" section (and app/assets/CHANGELOG.md, its copy) first."; exit 1
          fi
          mv caw-android.apk "caw-$version-android.apk"
          mv caw-windows.zip "caw-$version-windows.zip"
          mv caw-android-symbols.zip "caw-$version-android-symbols.zip"
          # Small updates: a manifest of every file, and patches from the channel's previous release where they
          # are smaller (scripts/update-delta.js applies each one and checks it before it is published).
          sudo apt-get install -y -q bsdiff >/dev/null || echo "::warning::bsdiff did not install: changed Windows files go whole."
          base=$(gh api "repos/$GITHUB_REPOSITORY/releases?per_page=30" | node scripts/update-delta.js pick-base --version "$version" || true)
          mkdir -p previous
          if [ -n "$base" ]; then
            gh release download "$base" -D previous -p "caw-${base#v}-android.apk" -p "caw-${base#v}-windows.zip" || true
          fi
          node scripts/update-delta.js --version "$version" --build "${GITHUB_SHA::12}" --prefix "caw-$version" \
            --apk "caw-$version-android.apk" --zip "caw-$version-windows.zip" \
            --base-apk "previous/caw-${base#v}-android.apk" --base-zip "previous/caw-${base#v}-windows.zip" \
            --base-build "$base" --list update-assets.txt
          mapfile -t update_assets < update-assets.txt
          {
            cat changes.md
            echo
            echo "C.A.W. $version"
            echo
            echo "- Android (arm64): caw-$version-android.apk"
            echo "- Windows (x64): caw-$version-windows.zip, unzip and run caw.exe"
            echo "- Android debug symbols (for decoding a reported stack trace): caw-$version-android-symbols.zip"
            if [ "$SIGNED" != "true" ]; then
              echo
              echo "This APK is signed with a throwaway key: uninstall the previous C.A.W. before installing it."
            fi
            echo
            # One line per asset; the app's updater checks a download against it (lib/model/updates/releases.dart).
            for f in "caw-$version-android.apk" "caw-$version-windows.zip" "caw-$version-android-symbols.zip" "${update_assets[@]}"; do
              echo "SHA256 $f: $(sha256sum "$f" | cut -d' ' -f1)"
            done
          } > notes.md
          prerelease=""
          [[ "$version" == *-* ]] && prerelease="--prerelease"
          gh release create "$tag" --target "$GITHUB_SHA" --title "C.A.W. $version" $prerelease \
            --notes-file notes.md --generate-notes \
            "caw-$version-android.apk" "caw-$version-windows.zip" "caw-$version-android-symbols.zip" "${update_assets[@]}"

  # "Every change" (owner, 2026-11-12): each push to Main that builds is published as one rolling pre-release,
  # tag latest-main, whose assets and notes are replaced each time. Never the repository's "latest" release, and
  # pushes to Main never make a stable release (that needs a v* tag or Run workflow with "release").
  every-change:
    name: Every change build
    needs: [android, windows]
    if: github.event_name == 'push' && github.ref == 'refs/heads/Main'
    runs-on: ubuntu-24.04
    # One at a time, so two pushes never race over the release; a newer push waiting replaces an older one.
    concurrency:
      group: every-change-release
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v7
        with:
          name: caw-android-apk
      - uses: actions/download-artifact@v7
        with:
          name: caw-windows-zip
      - name: Replace the latest-main release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(sed -n 's/^version: *\([^+]*\).*/\1/p' app/pubspec.yaml)
          # The same 12 characters as the builds' CAW_BUILD, which the app compares with this line.
          short="${GITHUB_SHA::12}"
          mv caw-android.apk caw-main-android.apk
          mv caw-windows.zip caw-main-windows.zip
          # Small updates: patches from the build this one replaces (the previous latest-main), checked by applying
          # them before they are published, and a manifest of every file (scripts/update-delta.js).
          mkdir -p previous
          base_build=""
          if gh release view latest-main >/dev/null 2>&1; then
            gh release download latest-main -D previous -p caw-main-android.apk -p caw-main-windows.zip || true
            base_build=$(gh release view latest-main --json body --jq .body | sed -n 's/^Build: *\([0-9a-f]*\).*/\1/p' | head -1)
          fi
          sudo apt-get install -y -q bsdiff >/dev/null || echo "::warning::bsdiff did not install: changed Windows files go whole."
          node scripts/update-delta.js --version "$version" --build "$short" --prefix caw-main \
            --apk caw-main-android.apk --zip caw-main-windows.zip \
            --base-apk previous/caw-main-android.apk --base-zip previous/caw-main-windows.zip \
            --base-build "$base_build" --list update-assets.txt
          mapfile -t update_assets < update-assets.txt
          {
            echo "Every change: untested builds. Each change to Main, built as it is; it may break."
            echo "For tested builds use the Stable channel (the public alpha) or Beta."
            echo
            echo "- Android (arm64): caw-main-android.apk"
            echo "- Windows (x64): caw-main-windows.zip, unzip and run caw.exe"
            echo
            # The app reads these lines (lib/model/updates/releases.dart).
            echo "Version: $version"
            echo "Build: $short"
            for f in caw-main-android.apk caw-main-windows.zip "${update_assets[@]}"; do
              echo "SHA256 $f: $(sha256sum "$f" | cut -d' ' -f1)"
            done
          } > notes.md
          git tag -f latest-main "$GITHUB_SHA"
          git push -f origin refs/tags/latest-main
          if gh release view latest-main >/dev/null 2>&1; then
            # Assets first, notes last: the notes never name a build (or checksums) whose files aren't there yet.
            gh release upload latest-main caw-main-android.apk caw-main-windows.zip "${update_assets[@]}" --clobber
            # A patch this build has none of (no previous build, or not smaller) must not outlive the build it was for.
            for stale in caw-main-android.cawpatch caw-main-windows.cawpatch; do
              if ! grep -qx "$stale" update-assets.txt; then gh release delete-asset latest-main "$stale" -y 2>/dev/null || true; fi
            done
            gh release edit latest-main --title "Every change (untested): $short" --notes-file notes.md \
              --prerelease --latest=false
          else
            gh release create latest-main --title "Every change (untested): $short" --notes-file notes.md \
              --prerelease --latest=false caw-main-android.apk caw-main-windows.zip "${update_assets[@]}"
          fi
